<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JS FPS Demo</title>
  <link rel="icon" type="image/png" href="Cube-Assault.png" />
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="overlay">
    <div id="overlayContent">
      <h1>JS FPS Demo</h1>
      <p id="overlayIntro">WASD or arrow keys to move, Space to jump, click the screen to enable the camera lock and look around.</p>
      <p id="status">Status: click to start</p>
      <p id="instructions">Camera lock is active after click. Move the mouse to look around normally.</p>
      <div id="gameOverPanel" class="hidden">
        <h2>GAME OVER</h2>
        <p id="finalScoreText">Final Score: 0</p>
        <p id="gameOverHint">The arena claimed your run.</p>
      </div>
      <div id="overlayActions">
        <button id="restartButton" class="overlay-button">Restart Game</button>
        <a id="homeButton" href="home.html" class="overlay-link">Back to Home</a>
      </div>
    </div>
  </div>
  <script type="module" src="game.js"></script>
</body>
</html>
